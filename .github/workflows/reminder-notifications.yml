name: Run reminder notifications

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notification tick
        env:
          NOTIFICATION_CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
        run: >-
          curl --fail-with-body --silent --show-error
          --request POST
          --header "x-notification-cron-secret: ${NOTIFICATION_CRON_SECRET}"
          https://date-reminder-api-aym7.onrender.com/api/notifications/tick
